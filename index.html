<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Ujin City Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

  <div id="hud">
    <div class="brand">
      <b>UJIN</b>
      <span>CITY DRIVE</span>
    </div>

    <div class="stats">
      <div>
        <small>SKOR</small>
        <b id="score">0</b>
      </div>
      <div>
        <small>KM/H</small>
        <b id="speed">0</b>
      </div>
      <div>
        <small>LEVEL</small>
        <b id="level">1</b>
      </div>
    </div>
  </div>

  <div id="gameContainer"></div>

  <div id="menu">
    <div class="card">
      <span>UJIN // NIGHT DRIVE</span>
      <h1>NEON<br><strong>CITY</strong></h1>
      <p>Jelajahi kota malam dan hindari kendaraan.</p>
      <button id="start">MULAI</button>
    </div>
  </div>

  <div id="over" class="hide">
    <div class="card">
      <span>PERJALANAN SELESAI</span>
      <h2>GAME OVER</h2>
      <p>Skor kamu</p>
      <strong id="finalScore">0</strong>
      <button id="restart">MAIN LAGI</button>
    </div>
  </div>

  <div id="controls">

    <div class="leftControls">
      <button id="left">‹</button>
      <button id="right">›</button>
    </div>

    <div class="rightControls">
      <button id="brake">REM</button>
      <button id="nitro">NITRO</button>
      <button id="gas">GAS</button>
    </div>

  </div>

</div>

<script type="module" src="game.js"></script>

</body>
</html>
